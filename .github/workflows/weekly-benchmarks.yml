name: Weekly Benchmarks

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-benchmarks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh benchmark snapshots
        run: npm run benchmarks:fetch:all

      - name: Verify test suite
        run: npm test

      - name: Commit updated benchmark snapshots
        shell: bash
        run: |
          if git diff --quiet -- data/benchmarks; then
            echo "No benchmark changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/benchmarks/*.json
          git commit -m "chore: refresh benchmark snapshots"
          git push
